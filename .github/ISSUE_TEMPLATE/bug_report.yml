name: Bug report
description: Report a reproducible problem without publishing private configuration or network details.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste WireGuard keys, complete configuration files, public IPs, real endpoints, hostnames, or unredacted journals. Follow SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `wg-healthcheck --version`, or the exact commit for a development build.
      placeholder: wg-healthcheck 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Linux distribution plus systemd, Bash, and Python versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Redacted reproduction
      description: Include the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private keys, public IPs, real endpoints, hostnames, private network layouts, and unredacted logs.
          required: true
        - label: This is not a vulnerability report; security reports follow SECURITY.md.
          required: true
