name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck

      - name: Validate Bash syntax
        run: bash -n bin/wg-healthcheck libexec/wg-healthcheck-managed install.sh scripts/*.sh tests/*.sh

      - name: Run Python contract tests as root
        run: |
          PYTHON_BIN="${pythonLocation:?}/bin/python"
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          sudo env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME=/root \
            "$PYTHON_BIN" -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run healthcheck tests as root
        run: |
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          sudo env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME=/root /bin/bash tests/test_wg_healthcheck.sh

      - name: Run managed-profile tests as root
        run: |
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          sudo env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME=/root /bin/bash tests/test_wg_managed_profiles.sh

      - name: Run installer and repository contract tests as root
        run: |
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          sudo env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME=/root /bin/bash tests/test_install.sh

      - name: Run healthcheck tests as the runner
        run: |
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME="$HOME" /bin/bash tests/test_wg_healthcheck.sh

      - name: Run managed-profile tests as the runner
        run: |
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME="$HOME" /bin/bash tests/test_wg_managed_profiles.sh

      - name: Run installer and repository contract tests as the runner
        run: |
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME="$HOME" /bin/bash tests/test_install.sh

      - name: Run release package tests as the runner
        run: |
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME="$HOME" /bin/bash tests/test_release.sh

      - name: Run ShellCheck
        run: shellcheck -x -S style bin/wg-healthcheck libexec/wg-healthcheck-managed install.sh scripts/*.sh tests/*.sh

      - name: Verify systemd units
        run: |
          sudo install -D -m 0755 bin/wg-healthcheck /usr/local/sbin/wg-healthcheck
          sudo install -D -m 0755 bin/wg-healthcheck-setup /usr/local/sbin/wg-healthcheck-setup
          sudo install -D -m 0755 libexec/airvpn-api /usr/local/libexec/wg-healthcheck/airvpn-api
          sudo install -D -m 0644 libexec/wg-healthcheck-managed /usr/local/libexec/wg-healthcheck/wg-healthcheck-managed
          sudo install -d -m 0755 /usr/local/libexec/wg-healthcheck/wg_healthcheck_setup
          sudo install -D -m 0644 libexec/wg_healthcheck_setup/*.py /usr/local/libexec/wg-healthcheck/wg_healthcheck_setup/
          cmp -s bin/wg-healthcheck /usr/local/sbin/wg-healthcheck
          cmp -s bin/wg-healthcheck-setup /usr/local/sbin/wg-healthcheck-setup
          cmp -s libexec/airvpn-api /usr/local/libexec/wg-healthcheck/airvpn-api
          cmp -s libexec/wg-healthcheck-managed /usr/local/libexec/wg-healthcheck/wg-healthcheck-managed
          test "$(stat -c '%a' /usr/local/sbin/wg-healthcheck)" = 755
          test "$(stat -c '%a' /usr/local/sbin/wg-healthcheck-setup)" = 755
          test "$(stat -c '%a' /usr/local/libexec/wg-healthcheck/airvpn-api)" = 755
          test "$(stat -c '%a' /usr/local/libexec/wg-healthcheck/wg-healthcheck-managed)" = 644
          test "$(stat -c '%a' /usr/local/libexec/wg-healthcheck/wg_healthcheck_setup)" = 755
          for setup_module in libexec/wg_healthcheck_setup/*.py; do
            cmp -s "$setup_module" "/usr/local/libexec/wg-healthcheck/wg_healthcheck_setup/${setup_module##*/}"
            test "$(stat -c '%a' "/usr/local/libexec/wg-healthcheck/wg_healthcheck_setup/${setup_module##*/}")" = 644
          done
          systemd-analyze verify systemd/wg-healthcheck@.service systemd/wg-healthcheck@.timer

  airvpn-api-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Probe the public AirVPN status contract
        run: |
          timeout --signal=TERM 45s python3 libexec/airvpn-api select \
            --url 'https://airvpn.org/api/status/?format=json' \
            --port 1637 \
            --timeout 20 >/dev/null
