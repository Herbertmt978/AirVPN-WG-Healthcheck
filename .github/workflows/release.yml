name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source and tag object
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Install release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck unzip

      - name: Verify annotated version tag
        run: |
          version="$(<VERSION)"
          test "$GITHUB_REF_NAME" = "v${version}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Run deterministic release checks
        run: |
          PYTHON_BIN="${pythonLocation:?}/bin/python"
          SAFE_PATH="${pythonLocation:?}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          bash -n bin/wg-healthcheck libexec/wg-healthcheck-managed install.sh scripts/*.sh tests/*.sh
          sudo env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME=/root \
            "$PYTHON_BIN" -m unittest discover -s tests -p 'test_*.py' -v
          sudo env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME=/root /bin/bash tests/test_wg_healthcheck.sh
          sudo env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME=/root /bin/bash tests/test_wg_managed_profiles.sh
          sudo env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME=/root /bin/bash tests/test_install.sh
          env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME="$HOME" /bin/bash tests/test_wg_healthcheck.sh
          env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME="$HOME" /bin/bash tests/test_wg_managed_profiles.sh
          env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME="$HOME" /bin/bash tests/test_install.sh
          env -i PATH="$SAFE_PATH" LC_ALL=C TMPDIR=/tmp PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 HOME="$HOME" /bin/bash tests/test_release.sh --ref "$GITHUB_REF_NAME"
          shellcheck -x -S style bin/wg-healthcheck libexec/wg-healthcheck-managed install.sh scripts/*.sh tests/*.sh
          sudo install -D -m 0755 bin/wg-healthcheck /usr/local/sbin/wg-healthcheck
          sudo install -D -m 0755 bin/wg-healthcheck-setup /usr/local/sbin/wg-healthcheck-setup
          sudo install -D -m 0755 libexec/airvpn-api /usr/local/libexec/wg-healthcheck/airvpn-api
          sudo install -D -m 0644 libexec/wg-healthcheck-managed /usr/local/libexec/wg-healthcheck/wg-healthcheck-managed
          sudo install -d -m 0755 /usr/local/libexec/wg-healthcheck/wg_healthcheck_setup
          sudo install -D -m 0644 libexec/wg_healthcheck_setup/*.py /usr/local/libexec/wg-healthcheck/wg_healthcheck_setup/
          cmp -s bin/wg-healthcheck /usr/local/sbin/wg-healthcheck
          cmp -s bin/wg-healthcheck-setup /usr/local/sbin/wg-healthcheck-setup
          cmp -s libexec/airvpn-api /usr/local/libexec/wg-healthcheck/airvpn-api
          cmp -s libexec/wg-healthcheck-managed /usr/local/libexec/wg-healthcheck/wg-healthcheck-managed
          test "$(stat -c '%a' /usr/local/sbin/wg-healthcheck)" = 755
          test "$(stat -c '%a' /usr/local/sbin/wg-healthcheck-setup)" = 755
          test "$(stat -c '%a' /usr/local/libexec/wg-healthcheck/airvpn-api)" = 755
          test "$(stat -c '%a' /usr/local/libexec/wg-healthcheck/wg-healthcheck-managed)" = 644
          test "$(stat -c '%a' /usr/local/libexec/wg-healthcheck/wg_healthcheck_setup)" = 755
          for setup_module in libexec/wg_healthcheck_setup/*.py; do
            cmp -s "$setup_module" "/usr/local/libexec/wg-healthcheck/wg_healthcheck_setup/${setup_module##*/}"
            test "$(stat -c '%a' "/usr/local/libexec/wg-healthcheck/wg_healthcheck_setup/${setup_module##*/}")" = 644
          done
          systemd-analyze verify systemd/wg-healthcheck@.service systemd/wg-healthcheck@.timer

      - name: Scan tagged history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact=100 --no-banner --no-color

      - name: Build reproducible release assets
        run: scripts/package-release.sh --ref "$GITHUB_REF_NAME" --output dist

      - name: Scan packaged release for secrets
        run: |
          version="$(<VERSION)"
          mkdir -m 0700 release-audit release-audit/tar release-audit/zip
          tar -xzf "dist/airvpn-wg-healthcheck-${version}.tar.gz" -C release-audit/tar
          unzip -q "dist/airvpn-wg-healthcheck-${version}.zip" -d release-audit/zip
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/release-audit:/scan:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /scan/tar --redact=100 --no-banner --no-color
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/release-audit:/scan:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /scan/zip --redact=100 --no-banner --no-color

      - name: Preserve verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-${{ github.sha }}
          path: |
            dist/airvpn-wg-healthcheck-*.tar.gz
            dist/airvpn-wg-healthcheck-*.zip
            dist/SHA256SUMS
            docs/releases/${{ github.ref_name }}.md
            VERSION
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.sha }}
          path: release-input

      - name: Verify downloaded assets
        run: |
          version="$(<release-input/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v${version}"
          test -f "release-input/docs/releases/${GITHUB_REF_NAME}.md"
          cd release-input/dist
          sha256sum -c SHA256SUMS

      - name: Create and verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(<release-input/VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "release-input/dist/airvpn-wg-healthcheck-${version}.tar.gz" \
            "release-input/dist/airvpn-wg-healthcheck-${version}.zip" \
            release-input/dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "AirVPN WireGuard Healthcheck ${GITHUB_REF_NAME}" \
            --notes-file "release-input/docs/releases/${GITHUB_REF_NAME}.md"
          assets="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' \
            SHA256SUMS \
            "airvpn-wg-healthcheck-${version}.tar.gz" \
            "airvpn-wg-healthcheck-${version}.zip" | sort)"
          test "$assets" = "$expected"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
